# Kaisa-Kaufprüfdienst (Cloudflare Workers). Einrichtung: README.md.
# Geheimnisse NIE hier eintragen, sondern: npx wrangler secret put GOOGLE_SERVICE_ACCOUNT --env <test|production>
name = "kaisa-verify"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ENVIRONMENT = "production"
# Nur diese Apps und Produkte werden bestätigt (Orbella-ID nach der endgültigen Paket-ID ergänzen)
APPS = '{"at.kaisasolutions.sudoku":["remove_ads_lifetime"]}'

[env.test]
name = "kaisa-verify-test"
vars = { ENVIRONMENT = "test", APPS = '{"at.kaisasolutions.sudoku":["remove_ads_lifetime"]}' }

[env.production]
name = "kaisa-verify"
vars = { ENVIRONMENT = "production", APPS = '{"at.kaisasolutions.sudoku":["remove_ads_lifetime"]}' }

# Schutz vor Missbrauch: höchstens 30 Prüfungen pro Minute und Absender
[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[env.test.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
