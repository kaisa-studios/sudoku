name: Bootstrap Flutter-Projekt
# Einmalig: erzeugt die nativen Android-/iOS-Projektordner und löst Paketversionen auf.
# Wird durch Änderung an .ci/bootstrap ausgelöst und committet das Ergebnis zurück.
on:
  push:
    paths: [".ci/bootstrap"]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter create
        id: create
        run: |
          mkdir -p /tmp/rep
          flutter --version > /tmp/rep/flutter_version.txt 2>&1
          flutter create --org at.kaisasolutions --project-name sudoku \
            --platforms android,ios --description "Tidy Sudoku" . > /tmp/rep/create.log 2>&1
      - name: Pakete hinzufügen
        id: pub
        run: |
          exec > /tmp/rep/pub.log 2>&1
          set -x
          flutter pub add flutter_riverpod drift drift_flutter path_provider path
          flutter pub add flutter_localizations --sdk=flutter
          flutter pub add --dev drift_dev build_runner
          flutter pub get
          cat pubspec.yaml
      - name: Rückcommit
        id: commit
        run: |
          exec > /tmp/rep/commit.log 2>&1
          set -x
          git config user.name "Kaisa Studios"; git config user.email "kaisa-studios@users.noreply.github.com"
          rm -f test/widget_test.dart
          git add -A
          git commit -m "Bootstrap: Flutter-Projekt (android/ios) und Paketversionen"
          git push origin HEAD:main
      - name: Bericht
        if: always()
        run: |
          cd /tmp/rep
          cp "$GITHUB_WORKSPACE/pubspec.yaml" "$GITHUB_WORKSPACE/pubspec.lock" . 2>/dev/null || true
          {
            echo "run ${{ github.run_id }} sha ${{ github.sha }}"
            echo "create=${{ steps.create.outcome }} pub=${{ steps.pub.outcome }} commit=${{ steps.commit.outcome }}"
          } > summary.txt
          git init -q -b r . && git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "Bootstrap-Bericht ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-status-bootstrap
