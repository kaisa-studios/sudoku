name: Screenshots
# Rendert echte App-Bildschirme als PNG (Ansicht für den Auftraggeber, später Store-Screenshots).
# Auslösen: .ci/screenshots ändern oder manuell. Ergebnis auf Branch ci-screens.
on:
  push:
    paths: [".ci/screenshots"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Screenshots rendern
        id: shots
        continue-on-error: true
        run: |
          mkdir -p /tmp/screens
          sudo apt-get install -y -qq libsqlite3-dev > /dev/null
          flutter pub get > /tmp/screens/log.txt 2>&1
          dart run build_runner build >> /tmp/screens/log.txt 2>&1
          export FONT_DIR="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts"
          ls "$FONT_DIR" >> /tmp/screens/log.txt 2>&1
          SCREENSHOTS=1 SCREENSHOT_DIR=/tmp/screens flutter test test/screenshots >> /tmp/screens/log.txt 2>&1
      - name: Ergebnis ablegen
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd /tmp/screens
          echo "run ${{ github.run_id }} sha ${{ github.sha }} shots=${{ steps.shots.outcome }}" > summary.txt
          git init -q -b r . && git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "Screenshots ${{ github.run_id }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-screens
