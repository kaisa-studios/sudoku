name: iOS-Build
# Unsignierter iOS-Build auf einem Mac-Runner von GitHub. Eigener Workflow, damit spätere Pushes ihn nicht
# abbrechen und er bei Engpässen an Mac-Runnern einzeln neu gestartet werden kann.
# Auslösen: "[ios]" in der Commit-Nachricht oder manuell. Bericht auf Branch ci-status-ios.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    if: contains(github.event.head_commit.message, '[ios]') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    # macos-latest (arm64) war am 5. Nov. 2026 wiederholt nicht verfügbar; Intel-Runner als Ausweichweg
    runs-on: ${{ vars.IOS_RUNNER || 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v4
      - name: Neuestes Xcode wählen
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] && sudo xcode-select -s "$x" || true
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Vorbereitung
        id: prep
        run: |
          mkdir -p /tmp/rep
          { flutter pub get && dart run build_runner build --delete-conflicting-outputs; } > /tmp/rep/prep.log 2>&1
      - name: iOS-Build ohne Signatur
        id: build
        continue-on-error: true
        run: flutter build ios --release --no-codesign > /tmp/rep/build.log 2>&1
      - name: Bericht
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd /tmp/rep
          {
            echo "run ${{ github.run_id }} sha ${{ github.sha }}"
            echo "prep=${{ steps.prep.outcome }} build=${{ steps.build.outcome }}"
            xcodebuild -version
          } > summary.txt 2>&1
          git init -q -b r . && git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "iOS-Bericht ${{ github.run_id }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-status-ios
      - name: Status
        if: always()
        run: test "${{ steps.build.outcome }}" = success
