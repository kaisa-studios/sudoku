name: CI
# Bei jedem Push auf main: Analyse, Tests, Android-Build.
# Ergebnisse landen als Bericht auf Branch ci-status-android,
# die installierbare Test-APK auf Branch ci-apk (beide werden jedes Mal überschrieben).
on:
  push:
    branches: [main]
    paths-ignore: [".ci/**", "docs/**", "*.md", "tool/**", ".github/workflows/content.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Vorbereitung
        id: prep
        run: |
          mkdir -p /tmp/rep
          flutter pub get > /tmp/rep/prep.log 2>&1
      - name: Analyse
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos > /tmp/rep/analyze.log 2>&1
      - name: Tests
        id: test
        continue-on-error: true
        run: flutter test --reporter expanded > /tmp/rep/test.log 2>&1
      - name: Android-APK bauen
        id: build
        continue-on-error: true
        run: |
          flutter build apk --release --target-platform android-arm64 > /tmp/rep/build.log 2>&1
          ls -la build/app/outputs/flutter-apk/ >> /tmp/rep/build.log
      - name: Bericht
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          REPO="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          cd /tmp/rep
          {
            echo "run ${{ github.run_id }} sha ${{ github.sha }}"
            echo "prep=${{ steps.prep.outcome }} analyze=${{ steps.analyze.outcome }} test=${{ steps.test.outcome }} build=${{ steps.build.outcome }}"
          } > summary.txt
          git init -q -b r . && git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "Android-Bericht ${{ github.run_id }}"
          git push -qf "$REPO" HEAD:refs/heads/ci-status-android
          APK="$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk"
          if [ "${{ steps.build.outcome }}" = "success" ] && [ -f "$APK" ]; then
            mkdir -p /tmp/apk && cd /tmp/apk
            cp "$APK" tidy-sudoku-test.apk
            echo "${{ github.sha }}" > sha.txt
            git init -q -b r . && git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
            git add -A && git commit -qm "Test-APK ${{ github.sha }}"
            git push -qf "$REPO" HEAD:refs/heads/ci-apk
          fi
      - name: Test-APK als Artefakt
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tidy-sudoku-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Status
        if: always()
        run: |
          test "${{ steps.prep.outcome }}" = success
          test "${{ steps.analyze.outcome }}" = success
          test "${{ steps.test.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
